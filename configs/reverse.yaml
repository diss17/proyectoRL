# Reverse curriculum: arena -> puerta -> media -> spawn, con consolidación final.
# Mismo criterio de transición, mismo muestreo mixto y mismo presupuesto que forward.
defaults: base.yaml

curriculum:
  enabled: true
  order: "reverse"
  frames: 1500000
  consolidation_frames: 500000
  window: 50
  threshold: 0.85
  epsilon_gate: 0.10
  replay_prob: 0.20

train:
  run_name: "reverse"
